name: Poll Discord cave attendance

# Vercel Cron on the Hobby plan can only run once a day (see vercel.json),
# which is too slow to pick up attendance posted in #cave-attendance
# promptly. This runs the same endpoint every 5 minutes instead.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Hit poll-cave-attendance endpoint
        run: |
          curl -sf -X POST "https://capital-records.vercel.app/api/discord/poll-cave-attendance" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
